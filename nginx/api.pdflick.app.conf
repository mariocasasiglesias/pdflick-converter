# /etc/nginx/sites-available/api.pdflick.app
# Publica la API de conversión (127.0.0.1:8787) en https://api.pdflick.app.
# El tráfico llega a través de Cloudflare (registro DNS con la nube naranja).

# Como máximo 10 conversiones por minuto y persona (ráfagas de 5).
limit_req_zone $binary_remote_addr zone=pdflick_api:10m rate=10r/m;

server {
    listen 80;
    server_name api.pdflick.app;
    return 301 https://$host$request_uri;
}

server {
    # Sintaxis de nginx 1.24 (la de Ubuntu 24.04); desde 1.25 se escribiría «http2 on;».
    listen 443 ssl http2;
    server_name api.pdflick.app;

    # Certificado de origen de Cloudflare (ver README, paso 5).
    ssl_certificate     /etc/ssl/cloudflare/pdflick-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/pdflick-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # IP real de la persona (Cloudflare la envía en CF-Connecting-IP), para que el límite
    # de peticiones se aplique por persona y no a todo Cloudflare.
    include /etc/nginx/snippets/cloudflare-realip.conf;

    client_max_body_size 26m;
    client_body_timeout 60s;

    # Sin registro de accesos: no se guarda quién convierte qué.
    access_log off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        limit_req zone=pdflick_api burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
    }
}
