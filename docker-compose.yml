# API de conversión de PDFlick: se instala en /opt/pdflick-api y se arranca con
#   docker compose up -d --build
# Solo escucha en 127.0.0.1:8787; nginx la publica como https://api.pdflick.app.
name: pdflick-api

services:
  api:
    build: ./api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8080"
    environment:
      ALLOWED_ORIGINS: "https://pdflick.app,https://www.pdflick.app,http://localhost:5173,http://localhost:4173"
      MAX_UPLOAD_MB: "25"
      MAX_PAGES: "150"
      CONVERT_TIMEOUT: "120"
      CONCURRENCY: "2"
      GOTENBERG_URL: "http://gotenberg:3000"
      # Dirección pública del código de este servicio (obligatorio por la licencia AGPL de PyMuPDF).
      SOURCE_URL: "https://github.com/mariocasasiglesias/pdflick-converter"
    # Sistema de archivos de solo lectura: los archivos solo pueden ir a /tmp, que está en memoria.
    read_only: true
    tmpfs:
      - /tmp:size=600m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
    networks: [public, internal]
    depends_on: [gotenberg]

  gotenberg:
    image: gotenberg/gotenberg:8.37.0
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=110s
      # Sin rutas de Chromium (HTML/URL a PDF): evita que alguien la use para pedir
      # páginas internas del servidor. Solo LibreOffice (Office -> PDF).
      - --chromium-disable-routes=true
      - --libreoffice-restart-after=20
      - --log-level=warn
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
    # Red interna: Gotenberg no tiene salida a internet ni se publica fuera.
    networks: [internal]

networks:
  public: {}
  internal:
    internal: true
